apiVersion: v3.2.0
kind: DataContract
id: urn:datacontract:checkout:orders-v3
name: Checkout Orders Data Contract
version: 3.2.0
status: active
domain: Checkout
dataProduct: OrderAnalytics
tenant: Global
description:
  purpose: Provides reliable and certified real-time customer order transactions for analytical processing, fraud detection, and reporting.
  limitations: Excludes raw payment gateway tokens and test transactions. Refunds are reflected as separate adjustment events.
  usage: Best queried via Trino / Athena using partitioned parquet files on S3 or directly through the PostgreSQL replica.
tags:
  - checkout
  - orders
  - e-commerce
  - tier-1
authoritativeDefinitions:
  - url: https://wiki.example.com/data-governance/checkout-orders
    type: documentation

servers:
  - server: production-s3
    type: s3
    environment: production
    location: s3://datacontract-checkout-prod/orders/v3/*.parquet
    format: parquet
    description: Primary production data lake storage partitioned by order_date.
  - server: postgres-replica
    type: postgresql
    environment: staging
    host: pg-replica.internal.example.com
    port: 5432
    database: checkout_analytics
    schema: public
    description: Read-only staging relational replica for validation queries.

schema:
  - name: orders
    physicalName: tbl_orders_v3
    logicalType: object
    description: Master table containing verified customer orders.
    authoritativeDefinitions:
      - url: https://wiki.example.com/schema/tbl_orders_v3
        type: ddl
    tags:
      - core-entity
      - pii-compliant
    relationships:
      - type: foreign_key
        from: customer_id
        to: customers.id
    properties:
      - name: order_id
        businessName: Order Identifier
        logicalType: string
        physicalType: varchar(64)
        description: Unique primary transaction identifier.
        required: true
        primaryKey: true
        primaryKeyPosition: 1
        unique: true
        examples:
          - "ORD-2026-98124"
          - "ORD-2026-98125"
      - name: customer_id
        businessName: Customer UUID
        logicalType: string
        physicalType: uuid
        description: Reference to the registered customer account.
        required: true
        classification: sensitive
        relationships:
          - type: foreign_key
            to: customers.id
      - name: order_timestamp
        businessName: Transaction Timestamp
        logicalType: timestamp
        physicalType: timestamptz
        description: UTC timestamp when the order was placed.
        required: true
      - name: order_date
        businessName: Partition Date
        logicalType: date
        physicalType: date
        description: Daily partition date (YYYY-MM-DD).
        required: true
        partitioned: true
        partitionKeyPosition: 1
      - name: order_total
        businessName: Gross Total Amount
        logicalType: number
        physicalType: decimal(12,2)
        description: Gross total amount charged in transaction currency.
        required: true
        criticalDataElement: true
        examples:
          - 129.99
          - 45.50
      - name: currency
        logicalType: string
        physicalType: varchar(3)
        description: ISO-4217 3-letter currency code.
        required: true
        examples:
          - "USD"
          - "EUR"
      - name: raw_metadata
        businessName: Gateway Raw Payload
        physicalType: jsonb
        description: Raw gateway event metadata (showcases property with physicalType only without logicalType).
      - name: shipping_address
        logicalType: object
        description: Customer shipping destination details.
        properties:
          - name: street
            logicalType: string
            physicalType: varchar(255)
            required: true
            classification: pii
          - name: city
            logicalType: string
            physicalType: varchar(100)
            required: true
          - name: postal_code
            logicalType: string
            physicalType: varchar(20)
            required: true
          - name: country
            logicalType: string
            physicalType: varchar(2)
            required: true
            examples:
              - "US"
              - "DE"
      - name: items
        logicalType: array
        description: Line items contained in this order.
        items:
          name: order_item
          logicalType: object
          properties:
            - name: sku
              logicalType: string
              physicalType: varchar(32)
              required: true
            - name: quantity
              logicalType: integer
              physicalType: int4
              required: true
              examples:
                - 1
                - 3
            - name: unit_price
              logicalType: number
              physicalType: decimal(10,2)
              required: true

slaProperties:
  - property: latency
    value: 15
    unit: minutes
    element: ingestion
    driver: business-reporting
  - property: freshness
    value: 1
    unit: hours
    element: table
    driver: dashboard-sync
  - property: availability
    value: 99.9
    unit: percentage
    element: s3-endpoint

quality:
  - type: rowCount
    description: Verifies that table contains data and is not empty.
    dimension: completeness
    rule: "rowCount > 0"
    severity: error
    engine: soda-core
    schedule: "0 * * * *"
  - type: freshness
    description: Verifies that latest order timestamp is within 2 hours.
    dimension: timeliness
    rule: "freshness(order_timestamp) < 2h"
    severity: warning
    engine: soda-core
  - type: validity
    description: Ensures currency matches standard supported currencies.
    dimension: validity
    rule: "currency in ('USD', 'EUR', 'GBP')"
    severity: error

team:
  - name: Alice Smith
    username: asmith
    role: Lead Data Engineer
    dateIn: "2024-01-15"
  - name: Bob Jones
    username: bjones
    role: Product Owner
    dateIn: "2023-08-01"

support:
  - channel: "#checkout-data-support"
    tool: slack
    scope: operational-incidents
    url: https://slack.com/archives/checkout-data-support
    description: Slack support channel for incident notifications and questions.
  - channel: "checkout-oncall@example.com"
    tool: email
    scope: escalation
    url: mailto:checkout-oncall@example.com
    description: On-call engineer mailing list.

roles:
  - role: data-analyst
    description: Read-only query access to aggregated views and non-PII fields.
    access: read
  - role: pipeline-writer
    description: Write and compaction access for automated ETL pipelines.
    access: write

price:
  amount: 0.05
  currency: USD
  unit: per-query-gb

